  <script src="https://cdn.tailwindcss.com"></script>

      #pdf-template { shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }

    .a4-container {

      min-height: 297mm;
      max-height: 297mm;

    }
  </style>
</head>
